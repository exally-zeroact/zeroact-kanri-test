<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>管理</title>
<link rel="stylesheet" href="css/kanri.css">
</head>
<body>
<main>
  <h1>管理</h1>

  <section id="login" class="card">
    <input id="email" type="email" autocomplete="username" placeholder="メールアドレス">
    <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
    <button id="signin" class="btn" type="button">入る</button>
    <p id="loginErr" class="err" role="alert"></p>
  </section>

  <section id="denied" class="card hide">
    <p>この画面は管理者だけが使えます。</p>
    <button id="out1" class="btn-sub" type="button">出る</button>
  </section>

  <section id="panel" class="hide">
    <nav id="apps" aria-label="アプリ"></nav>
    <div id="counts"></div>

    <div id="inviteBox" class="card">
      <button id="mkInvite" class="btn" type="button">招待URLを作る</button>
      <p id="inviteNote" class="sub"></p>
      <div id="inviteOut" class="hide">
        <div id="inviteUrl"></div>
        <div class="seg">
          <button id="share" class="btn-sub" type="button">送る</button>
          <button id="copy" class="btn-sub" type="button">写す</button>
        </div>
      </div>
      <div id="invites"></div>
    </div>

    <h2>人</h2>
    <input id="q" type="search" placeholder="アドレスで探す">
    <div id="list"></div>
    <p><button id="out2" class="btn-sub" type="button">出る</button></p>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="lib/supabase-js-2.112.4.min.js"></script>
<script src="js/supa-config.js"></script>
<script src="js/kanri.js"></script>
<script src="js/env-badge.js"></script>
</body>
</html>
